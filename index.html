<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live-Folie</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  :root {
    --bg: #0e0f11; --panel: #17191c; --line: #2c3035; --text: #f4f1ea;
    --muted: #9ea2a8; --accent: #f3a43b; --accent-ink: #1a1206; --warn: #e8573f;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); }
  #frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
  .hidden { display: none !important; }

  /* Zahnrad: erscheint nur, wenn die Maus in die obere rechte Ecke kommt */
  #hotspot { position: absolute; top: 0; right: 0; width: 70px; height: 70px; z-index: 5; }
  #gear {
    position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--line); background: rgba(23,25,28,.88); color: var(--text);
    font-size: 19px; line-height: 1; cursor: pointer; opacity: 0; transition: opacity .15s;
  }
  #hotspot:hover #gear, #gear:focus-visible { opacity: 1; }

  #status {
    position: absolute; inset: 0; display: grid; place-items: center; z-index: 2;
    color: var(--muted); font-size: 15px; pointer-events: none;
  }

  #panel {
    position: absolute; inset: 0; z-index: 10; display: grid; place-items: center;
    background: rgba(14,15,17,.92); padding: 16px;
  }
  .card {
    width: min(560px, 100%); background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 12px;
  }
  .card h1 { margin: 0; font-size: 19px; }
  .card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
  .card input {
    width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: 14px ui-monospace, Menlo, monospace;
  }
  .card input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .card button {
    padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: transparent; color: var(--text); font: inherit; font-size: 14px; cursor: pointer;
  }
  .card button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  #hint { min-height: 1.2em; font-size: 13px; color: var(--warn); }
  #hint.ok { color: var(--muted); }
</style>
</head>
<body>
  <iframe id="frame" title="Live-Ansicht"
          allow="fullscreen; clipboard-read; clipboard-write; autoplay"
          referrerpolicy="no-referrer"></iframe>
  <div id="status" class="hidden">Lade …</div>

  <div id="hotspot"><button id="gear" title="Adresse ändern" aria-label="Adresse ändern">⚙︎</button></div>

  <div id="panel" class="hidden">
    <form class="card" id="form" autocomplete="off">
      <h1>Adresse der Beamer-Ansicht</h1>
      <p>Startskript doppelklicken. Die Beamer-Adresse liegt danach in der Zwischenablage.
         Hier hineinklicken, <b>Cmd&nbsp;+&nbsp;V</b> drücken und „Übernehmen“ wählen.
         Die Adresse gilt dann für alle Live-Folien dieser Präsentation.</p>
      <input id="url" type="text" spellcheck="false" placeholder="https://….trycloudflare.com/beamer?key=…">
      <div id="hint" class="ok"></div>
      <div class="row">
        <button type="submit" class="primary">Übernehmen</button>
        <button type="button" id="reload">Neu laden</button>
        <button type="button" id="cancel">Abbrechen</button>
      </div>
    </form>
  </div>

<script>
(function () {
  "use strict";
  var KEY = "liveFolie";               // Name des gespeicherten Werts
  var frame = document.getElementById("frame");
  var statusEl = document.getElementById("status");
  var panel = document.getElementById("panel");
  var input = document.getElementById("url");
  var hint = document.getElementById("hint");
  var current = null;                  // { url, ts }
  var inOffice = false;

  // ---------- Speichern / Lesen ----------
  // Zwei Orte: die Präsentation selbst (bleibt in der .pptx) und der gemeinsame
  // Speicher aller Live-Folien auf diesem Mac. Der neuere Eintrag gewinnt.
  function readLocal() {
    try { var v = JSON.parse(localStorage.getItem(KEY)); return v && v.url ? v : null; }
    catch (e) { return null; }
  }
  function writeLocal(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} }

  function readDoc() {
    if (!inOffice) return null;
    try { var v = Office.context.document.settings.get(KEY); return v && v.url ? v : null; }
    catch (e) { return null; }
  }
  function writeDoc(v) {
    if (!inOffice) return;
    try {
      var s = Office.context.document.settings;
      s.set(KEY, v);
      s.saveAsync(function () {});
    } catch (e) {}
  }

  function newest(a, b) {
    if (!a) return b; if (!b) return a;
    return (b.ts || 0) > (a.ts || 0) ? b : a;
  }

  // ---------- Anzeige ----------
  function show(v) {
    current = v;
    if (!v) { openPanel(); return; }
    statusEl.classList.remove("hidden");
    frame.src = v.url;
  }
  frame.addEventListener("load", function () { statusEl.classList.add("hidden"); });

  function openPanel() {
    input.value = current ? current.url : "";
    checkHint();
    panel.classList.remove("hidden");
    setTimeout(function () { input.focus(); input.select(); }, 30);
  }
  function closePanel() { panel.classList.add("hidden"); }

  function normalize(raw) {
    var u = (raw || "").trim();
    if (!u) return "";
    if (!/^[a-z]+:\/\//i.test(u)) u = "https://" + u;
    return u;
  }
  function checkHint() {
    var u = normalize(input.value);
    hint.className = "";
    if (!u) { hint.className = "ok"; hint.textContent = ""; return true; }
    try { new URL(u); } catch (e) { hint.textContent = "Das sieht nicht wie eine Web-Adresse aus."; return false; }
    if (!/^https:\/\//i.test(u)) { hint.textContent = "Die Adresse muss mit https:// beginnen."; return false; }
    if (u.indexOf("/beamer") === -1) {
      hint.className = "ok";
      hint.textContent = "Hinweis: Das ist nicht die Beamer-Adresse (/beamer?key=…). Übernehmen geht trotzdem.";
      return true;
    }
    hint.className = "ok"; hint.textContent = ""; return true;
  }

  // ---------- Bedienung ----------
  document.getElementById("gear").addEventListener("click", openPanel);
  document.getElementById("cancel").addEventListener("click", function () { if (current) closePanel(); });
  document.getElementById("reload").addEventListener("click", function () {
    var u = normalize(input.value) || (current && current.url);
    if (!u) return;
    closePanel(); statusEl.classList.remove("hidden");
    frame.src = "about:blank";
    setTimeout(function () { frame.src = u; }, 50);
  });
  input.addEventListener("input", checkHint);
  document.getElementById("form").addEventListener("submit", function (e) {
    e.preventDefault();
    if (!checkHint()) return;
    var u = normalize(input.value);
    if (!u) return;
    var v = { url: u, ts: Date.now() };
    writeLocal(v); writeDoc(v);
    closePanel(); show(v);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !panel.classList.contains("hidden") && current) closePanel();
  });

  // Eine andere Live-Folie hat eine neue Adresse bekommen: hier ebenfalls übernehmen.
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var v = readLocal();
    if (v && (!current || v.ts > (current.ts || 0))) { writeDoc(v); closePanel(); show(v); }
  });

  // ---------- Start ----------
  var started = false;
  function start() {
    if (started) return; started = true;
    var v = newest(readDoc(), readLocal());
    if (v) { writeLocal(v); writeDoc(v); }
    show(v);
  }
  if (window.Office && Office.onReady) {
    Office.onReady(function (info) {
      inOffice = !!(info && info.host);
      if (!started) { start(); return; }
      // Office war langsamer als die Notlösung: gespeicherte Adresse nachträglich abgleichen
      var v = newest(readDoc(), current);
      if (v && v !== current) { writeLocal(v); closePanel(); show(v); } else if (current) { writeDoc(current); }
    });
    setTimeout(start, 4000);           // falls Office.js nicht antwortet
  } else {
    start();
  }
})();
</script>
</body>
</html>
